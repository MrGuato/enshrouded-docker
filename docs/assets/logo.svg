<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Enshrouded Dedicated Server">
  <defs>
    <clipPath id="face"><circle cx="64" cy="64" r="51"/></clipPath>
    <radialGradient id="shroud" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#3d2b63"/>
      <stop offset="1" stop-color="#120d1f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- stone rim -->
  <circle cx="64" cy="64" r="61" fill="#1d1829"/>
  <circle cx="64" cy="64" r="58" fill="#5d5672"/>
  <circle cx="64" cy="64" r="53" fill="#1d1829"/>
  <g clip-path="url(#face)">
    <!-- the shroud -->
    <rect width="128" height="128" fill="url(#shroud)"/>
    <circle cx="64" cy="44" r="34" fill="url(#glow)"/>
    <!-- flame altar: a stone pedestal with two server bays -->
    <rect x="44" y="60" width="40" height="6" rx="1.5" fill="#8b8499"/>
    <rect x="44" y="60" width="40" height="2" rx="1" fill="#b3adc0"/>
    <path d="M48 66 H80 L83.5 91 H44.5 Z" fill="#5d5672"/>
    <rect x="52" y="71" width="24" height="4.4" rx="1.2" fill="#1d1829"/>
    <rect x="52" y="79" width="24" height="4.4" rx="1.2" fill="#1d1829"/>
    <circle cx="72.4" cy="73.2" r="1.3" fill="#7fe0a0"/>
    <circle cx="72.4" cy="81.2" r="1.3" fill="#ffb53d"/>
    <rect x="40" y="91" width="48" height="6" rx="1.5" fill="#8b8499"/>
    <!-- the Flame -->
    <path d="M64 19 C66 28 74 33 79 41 C83 48 80 57 72 60.5 C68 62 60 62 56 60.5 C48 57 45 48 49 41 C51 37 54 35 56 31 C57 36 59 39 61.5 40.5 C60.5 33 61 25 64 19 Z" fill="#ff6a1a"/>
    <path d="M64 31 C66 38 72 42 74 48 C75.5 53 73 58 68 59.6 C65.5 60.3 62.5 60.3 60 59.6 C55 58 52.5 53 54 48 C55 45 57.5 43 59 40 C60 43 61.5 45 63 46 C62.5 41 62.8 36 64 31 Z" fill="#ffb03a"/>
    <path d="M64 43.5 C65.5 47.5 69 50.5 68.6 54.5 C68.3 57.5 66.3 59 64 59 C61.7 59 59.7 57.5 59.4 54.5 C59 50.5 62.5 47.5 64 43.5 Z" fill="#fff1bf"/>
    <!-- shroud mist rolling over the base -->
    <path d="M0 99 C18 93 36 103 62 98 C90 93 108 103 128 97 V128 H0 Z" fill="#6c3fb0" fill-opacity=".6"/>
    <path d="M0 108 C24 102 44 112 70 106 C96 101 112 110 128 105 V128 H0 Z" fill="#a778e8" fill-opacity=".4"/>
  </g>
  <!-- rim rivets -->
  <g fill="#c8c3d4">
    <circle cx="64" cy="8.5" r="2.4"/><circle cx="64" cy="119.5" r="2.4"/>
    <circle cx="8.5" cy="64" r="2.4"/><circle cx="119.5" cy="64" r="2.4"/>
    <circle cx="24.8" cy="24.8" r="2.4"/><circle cx="103.2" cy="24.8" r="2.4"/>
    <circle cx="24.8" cy="103.2" r="2.4"/><circle cx="103.2" cy="103.2" r="2.4"/>
  </g>
</svg>
