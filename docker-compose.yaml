services:
  enshrouded:
    image: ${IMAGE_REPOSITORY:-ghcr.io/mrguato/enshrouded-docker}:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: ${CONTAINER_NAME:-enshrouded-server}
    restart: unless-stopped
    # The server gets Ctrl+C and up to STOP_TIMEOUT (90s) to exit; Docker waits a little longer.
    stop_grace_period: 2m
    ports:
      - "${QUERY_PORT:-15637}:${QUERY_PORT:-15637}/udp"   # players and the server browser
      - "27015:27015/udp"                                 # Steam
    env_file: .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UPDATE_ON_START: ${UPDATE_ON_START:-true}
    volumes:
      - ./enshrouded-config:/home/steam/config   # enshrouded_server.json, savegame/, logs/
      - ./enshrouded-server:/home/steam/server   # game files from SteamCMD (~6 GB, reproducible)
      - ./enshrouded-wine:/home/steam/.wine      # Wine prefix (reproducible, saves a minute on start)
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower-enshrouded
    restart: unless-stopped
    # Runs at 05:00 every day (in TZ from .env); updates only labeled services; cleans old images.
    # Watchtower cron has a seconds field first: "0 5 * * *" would mean every hour at minute 5.
    command: --label-enable --cleanup --schedule "0 0 5 * * *"
    environment:
      TZ: ${TZ:-UTC}
      # Docker Engine 29+ rejects the old API version watchtower's client negotiates
      # ("client version 1.25 is too old"); pinning the API version fixes the crash loop.
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
